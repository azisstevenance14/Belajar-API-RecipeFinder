<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASSA Recipe Finder</title>
    <!-- Bootstrap 5.3 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- Navbar Sederhana -->
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🍳 ASSA Recipe App</a>
        </div>
    </nav>

    <!-- Konten Utama -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center">
                <h2 class="fw-bold mb-3">Mau Masak Apa Hari Ini?</h2>
                <p class="text-muted">Cari resep makanan favoritmu dengan mudah dan cepat.</p>
                
                <!-- Form Pencarian -->
                <div class="input-group mb-4 shadow-sm">
                    <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="Contoh: Chicken, Soup, Pasta...">
                    <button class="btn btn-dark px-4" type="button" id="searchBtn">Cari Resep</button>
                </div>
            </div>
        </div>

        <!-- Area Loading / Spinner -->
        <div id="loading" class="text-center d-none my-4">
            <div class="spinner-grow text-successRecipe" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="text-muted mt-2">Sedang mencari resep...</p>
        </div>

        <!-- Grid Tempat Kartu Resep Ditampilkan oleh JavaScript -->
        <div class="row" id="recipeContainer">
            <!-- Data Resep Masuk Lewat DOM Disini -->
        </div>
    </div>

    <!-- Bootstrap JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
